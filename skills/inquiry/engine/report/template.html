      const checks = (R.origin_checks || []).filter((o) => o.family === k);
      el.innerHTML = `<span class="eyebrow">역추적 · 돌던 주장</span><h3>${esc(f.text)}</h3>
        <dl class="kv"><dt>글</dt><dd>${esc(f.posts)}건, 원출처 ${esc(f.origin_groups)}곳</dd><dt>플랫폼</dt><dd>${esc((f.platforms || []).join(", "))}</dd></dl>
        <span class="k eyebrow">이 주장에서 나온 명제</span><span class="row">${(R.claims || []).filter((c) => (c.from_families || []).includes(k)).map((c) => `<button class="chip s-${esc(c.status)}" data-go="claim:${esc(c.id)}">${esc(c.id)} ${esc(T.status[c.status])}</button>`).join("")}</span>
        ${checks.length ? `<span class="k eyebrow">원출처 대조</span>${checks.map((o) => `<div class="ev"><span class="chip ${o.fidelity === "faithful" ? "l-supports" : "l-refutes"}">${esc(T.fidelity[o.fidelity] || o.fidelity)}</span><div class="quote">${esc(o.post)}</div><div class="quote l-supports">${esc(o.origin)}</div></div>`).join("")}` : ""}
        <span class="k eyebrow">글 ${leads.length}건</span>${leads.map((l) => `<div class="small"><span class="chip lead">${esc(l.platform)}</span> ${l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(clip(l.text || l.url, 90))}</a>` : esc(l.text)}</div>`).join("")}`;
    } else if (t === "search") {
      const s = by.search[k];
      const found = (R.sources || []).filter((x) => (x.found_by || []).includes(k));
      el.innerHTML = `<span class="eyebrow">역추적 · 검색</span><h3 class="mono" style="font-size:13px;font-weight:500">${esc(s.query)}</h3>
        <dl class="kv"><dt>쪽</dt><dd>${esc(T.side[s.side] || s.side)}</dd><dt>언어</dt><dd>${esc(T.lang[s.lang] || s.lang)}</dd><dt>채널</dt><dd>${esc(s.channel)}</dd><dt>결과</dt><dd>${esc(s.hits ?? "-")}건</dd>${s.claim ? `<dt>명제</dt><dd><button class="chip" data-go="claim:${esc(s.claim)}">${esc(s.claim)}</button></dd>` : ""}</dl>
        <span class="k eyebrow">이 검색으로 읽은 출처 ${found.length}건</span>${found.map((x) => `<div class="small"><button class="chip" data-go="src:${esc(x.id)}">${esc(x.id)}</button> ${esc(clip(x.title, 70))}</div>`).join("") || '<span class="empty">없음</span>'}`;
    } else if (t === "ev") {
      const e = by.ev[k];
      el.innerHTML = `<span class="eyebrow">역추적 · 증거</span>${evBlock(e, true)}`;
    } else if (t === "lead") {
      const l = by.lead[k];
      el.innerHTML = `<span class="eyebrow">역추적 · 단서</span><h3>${esc(l.text || l.url)}</h3>${l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a>` : ""}${l.family ? `<button class="chip lead" data-go="fam:${esc(l.family)}">${esc(l.family)}</button>` : ""}`;
    }
    el.insertAdjacentHTML("afterbegin", '<button class="toggle close" id="t-close" type="button">닫기</button>');
    el.querySelector("#t-close").addEventListener("click", clearSelection);
    el.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", (ev) => { ev.stopPropagation(); select(b.dataset.go); }));
  }

  // ---------- sources table ----------
  function drawSources(kind) {
    const rows = (R.sources || []).filter((s) => kind === "all" || s.kind === kind).map((s) => {
      const evs = by.evBySrc[s.id] || [];
      const search = (s.found_by || []).map((id) => by.search[id]).filter(Boolean)[0];
      return `<tr><td><button class="chip" data-go="src:${esc(s.id)}">${esc(s.id)}</button> ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(clip(s.title || s.host, 70))}</a>` : esc(clip(s.title, 70))}<div class="small muted">${esc(s.host)}</div></td>
        <td>${esc(T.kind[s.kind] || s.kind)}</td><td>${esc(s.access === "full_text" ? "전문" : s.access === "abstract" ? "초록" : s.access || "-")}</td>
        <td class="small">${search ? `${esc(T.side[search.side] || "")} · <span class="mono">${esc(clip(search.query, 40))}</span>` : '<span class="muted">원출처 추적</span>'}</td>
        <td><span class="row">${evs.map((e) => `<span class="chip l-${esc(e.label)}">${esc(e.claim)} ${esc(T.role[e.role]?.split("(")[0] || e.role)}</span>`).join("")}</span></td></tr>`;
    });
    document.getElementById("srcrows").innerHTML = rows.join("") || `<tr><td colspan="5" class="empty">해당 종류의 출처가 없습니다.</td></tr>`;
    document.querySelectorAll("#srcrows [data-go]").forEach((b) => b.addEventListener("click", () => select(b.dataset.go)));
  }

  // ---------- interaction ----------
  function select(id, extraRefs, key) {
    state.sel = id; state.selKey = key || null;
    if (id && !key) {
      if (id.startsWith("src:") && !state.showAll && !visibleEv().some((e) => "src:" + e.source === id)) { state.showAll = true; const t = document.getElementById("t-all"); if (t) t.setAttribute("aria-pressed", "true"); }
      [id, ...(extraRefs || [])].forEach(expandToRef);
      drawGraph();
    }
    state.focus = key ? [key] : [id, ...(extraRefs || [])].flatMap(keysForRef);
    applyFocus();
    showTrace();
    const k = state.focus[0];
    if (k) revealKey(k);
  }

  function clearSelection() {
    state.sel = null; state.selKey = null; state.focus = [];
    document.querySelectorAll(".sent").forEach((x) => x.classList.remove("on"));
    applyFocus();
    showTrace();
  }

  /** Pressing a picked node again lets it go; when nothing is left picked, the whole selection clears. */
  function unpick(key) {
    // a claim appears in several stages; letting one copy go lets the claim go
    const ref = FLAT.find((x) => x.key === key)?.ref;
    state.focus = state.focus.filter((k) => k !== key && !(ref && FLAT.find((x) => x.key === k)?.ref === ref));
    if (!state.focus.length) return clearSelection();
    const next = FLAT.find((x) => x.key === state.focus[0]);
    state.selKey = next.key; state.sel = next.ref || null;
    applyFocus();
    showTrace();
  }

  function wire() {
    const onNode = (g) => {
      const n = FLAT.find((x) => x.key === g.dataset.key); if (!n) return;
      if (state.focus.includes(n.key)) return unpick(n.key);
      if (n.children.length && !n.noFold) {
        // a closed branch opens; an open branch without a record of its own closes
        if (tstate.collapsed.has(n.key)) tstate.collapsed.delete(n.key);
        else if (!n.ref) tstate.collapsed.add(n.key);
        drawGraph();
      }
      if (n.ref) select(n.ref, null, n.key); else { state.sel = null; state.selKey = n.key; state.focus = [n.key]; applyFocus(); showTrace(); }
    };
    document.getElementById("graph").addEventListener("click", (ev) => { if (dragMoved) return; const g = ev.target.closest(".tnode"); if (g) onNode(g); });
    wirePanZoom();
    document.getElementById("graph").addEventListener("keydown", (ev) => { if (ev.key !== "Enter" && ev.key !== " ") return; const g = ev.target.closest(".tnode"); if (g) { ev.preventDefault(); onNode(g); } });
    document.addEventListener("keydown", (ev) => {
      if (ev.key !== "Escape") return;
      if (state.focus.length || state.sel) clearSelection();
      else if (document.body.classList.contains("graph-max")) toggleMax(false);
    });
    document.getElementById("t-open").addEventListener("click", () => { tstate.collapsed.clear(); drawGraph(); });
    document.getElementById("t-shut").addEventListener("click", () => { tstate.collapsed.clear(); tstate.ready = false; drawGraph(); });
    document.getElementById("t-all").addEventListener("click", (ev) => { state.showAll = !state.showAll; ev.currentTarget.setAttribute("aria-pressed", String(state.showAll)); drawGraph(); });
    document.getElementById("t-clear").addEventListener("click", clearSelection);
    // citations: a number and its source light each other up
    const hl = (n, on) => {
      document.querySelectorAll(`.cite[data-n="${n}"], .srcitem[data-n="${n}"]`).forEach((x) => x.classList.toggle("hl", on));
      document.querySelectorAll(".sent").forEach((x) => x.classList.toggle("hl", on && !!x.querySelector(`.cite[data-n="${n}"]`)));
    };
    document.querySelectorAll(".cite, .srcitem").forEach((el) => {
      el.addEventListener("mouseenter", () => { hl(el.dataset.n, true); if (el.classList.contains("cite")) document.querySelector(`.srcitem[data-n="${el.dataset.n}"]`)?.scrollIntoView({ block: "nearest" }); });
      el.addEventListener("mouseleave", () => hl(el.dataset.n, false));
    });
    document.querySelectorAll(".cite").forEach((b) => b.addEventListener("click", (ev) => { ev.stopPropagation(); select(document.querySelector(`.srcitem[data-n="${b.dataset.n}"]`).dataset.go); }));
    document.querySelectorAll(".srcitem").forEach((c) => c.addEventListener("keydown", (ev) => { if (ev.key === "Enter") select(c.dataset.go); }));
    document.querySelectorAll(".sent").forEach((li) => {
      const act = () => {
        if (li.classList.contains("on")) return clearSelection();
        document.querySelectorAll(".sent").forEach((x) => x.classList.toggle("on", x === li));
        const s = R.verdict.sentences[+li.dataset.sent];
        const refs = s.refs || [];
        select("claim:" + (refs[0] || R.verdict.root), refs.slice(1).map((c) => "claim:" + c));
      };
      li.addEventListener("click", act);
      li.addEventListener("keydown", (ev) => { if (ev.key === "Enter") act(); });
    });
    document.querySelectorAll("#app [data-go]").forEach((b) => b.addEventListener("click", () => select(b.dataset.go)));
    document.querySelectorAll(".card").forEach((c) => c.addEventListener("keydown", (ev) => { if (ev.key === "Enter") select(c.dataset.go); }));
    document.querySelectorAll("#kindf .toggle").forEach((b) => b.addEventListener("click", () => {
      document.querySelectorAll("#kindf .toggle").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      drawSources(b.dataset.kind);
    }));
  }

  // a built report carries its data inside; the template on its own reads report.json beside it
  const embedded = document.getElementById("report-data");
  const load = embedded ? Promise.resolve(JSON.parse(embedded.textContent)) : fetch("./report.json").then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  load.then((data) => {
    if (data.schema !== "inquiry/report@0") throw new Error("schema " + data.schema);
    R = data; by = index(R);
    document.title = "inquiry · " + clip(R.meta.question, 40);
    render();
    if (document.fonts) {
      // Korean web fonts load in pieces as glyphs appear; measure again when a piece lands
      let refit = 0;
      const again = () => { clearTimeout(refit); refit = setTimeout(() => { fitCache.clear(); drawGraph(); }, 120); };
      document.fonts.ready.then(again);
      document.fonts.addEventListener("loadingdone", again);
    }
  }).catch((e) => {
    document.getElementById("app").innerHTML = `<div class="err">보고서 데이터(report.json)를 읽지 못했습니다: ${esc(e.message)}. 이 페이지는 report.json과 함께 게시해야 합니다.</div>`;
  });
})();
</script>
